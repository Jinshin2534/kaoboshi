<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>かおぼし</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌠</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="sky"></canvas>

  <div id="first" class="first" hidden>
    <button id="pick-first" class="btn">顔画像を選ぶ</button>
    <p class="hint">あとで変えるときは画面を長押し（Mac は S キー）</p>
  </div>

  <p id="notice" class="notice" hidden></p>

  <div id="panel" class="panel" hidden>
    <div class="panel-inner">
      <div id="faces" class="faces"></div>
      <label class="freq">
        <span>頻度</span>
        <input id="freq" type="range" min="1" max="10" step="1" />
      </label>
      <div class="row">
        <button id="add" class="btn small">画像を追加</button>
        <button id="shoot" class="btn small">いま流す</button>
        <button id="close" class="btn small">閉じる</button>
      </div>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
